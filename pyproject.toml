[project]
name = "stft-pcg-denoise"
version = "0.3.0"
description = "STFT PCG denoiser: does adding CirCor to the training set help on the device domain?"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "wandb>=0.17",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
